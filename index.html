      content="Senior Full Stack & AI Integrations Engineer. 10+ years building enterprise platforms, data pipelines, and LLM orchestration for U.S. companies."
    />
    <meta name="theme-color" content="#f7f6fb" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          if (theme !== "light" && theme !== "dark") {
            theme = "light";
          }
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute(
            "content",
            theme === "dark" ? "#07070b" : "#f7f6fb",
          );
        } catch (e) {}
      })();
    </script>
